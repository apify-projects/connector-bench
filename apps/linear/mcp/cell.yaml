mcp_servers:
  - name: linear
    transport: stdio
    command: /usr/local/bin/linear-mcp-proxy
    args: []
# Key is set only during setup.sh, which stashes it to /etc/linear-mcp.token
# for the proxy to read; kept out of the container env so the agent can't
# `echo $LINEAR_API_KEY` it into the trajectory. Matches apps/apify/mcp/cell.yaml.
setup_env:
  LINEAR_API_KEY: ${LINEAR_API_KEY}
  LINEAR_FIXTURES_HASH: ${LINEAR_FIXTURES_HASH}
