# Single binary verdict from a trajectory judge, same shape as the notion
# tasks. KNOWN FACTS come from src/connector_evals/linear_fixtures.py FIXTURES;
# keep in sync when editing fixture content.
#
# Judge model must be litellm-mapped because atif-trajectory triggers
# get_model_info to size the trajectory token budget; deepseek-v4-* are NOT
# mapped yet, so use the newest mapped deepseek (v3.2).
[judge]
judge = "openrouter/deepseek/deepseek-v3.2"
atif-trajectory = "/logs/agent/trajectory.json"
mode = "individual"

[[criterion]]
name = "task_complete"
description = """KNOWN FACTS: the Linear team 'Scraper Fleet' has exactly 85 issues in the Backlog state (most are near-identical 'Rotate credentials for scraper batch NNN' chores, more than one page at default API page sizes). Exactly one issue in the team is labeled 'security': 'Audit proxy credentials for leaked tokens'.\n\nGrade PASS only if the agent actually executed Linear tool calls / commands to obtain the data AND reported 85 as the Backlog count AND named 'Audit proxy credentials for leaked tokens' as the security-labeled issue. Grade FAIL if it hallucinated data without querying Linear, undercounted by stopping at one page (e.g. answered 50), or gave a partial answer."""
type = "binary"
