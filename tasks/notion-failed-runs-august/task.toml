version = "1.0"

[task]
name = "connector-evals/notion-failed-runs-august"
description = "Query the seeded 'Scraper Runs' Notion database for failed runs in August 2026. LLM trajectory judge."

[metadata]
difficulty = "medium"
category = "single_step"
tags = ["read-only", "database"]

[connector_evals]
apps = ["notion"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 300.0

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
# Rewardkit always sends `reasoning_effort` to the judge; DeepSeek models on
# OpenRouter expose `reasoning` (not `reasoning_effort`), so litellm raises
# UnsupportedParamsError. Drop unsupported params instead of erroring.
LITELLM_DROP_PARAMS = "True"
