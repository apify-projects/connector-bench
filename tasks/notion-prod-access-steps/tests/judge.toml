# Single binary verdict from a trajectory judge, same shape as the github
# tasks. KNOWN FACTS come from src/connector_evals/notion_fixtures.py FIXTURES;
# keep in sync when editing fixture content.
#
# Judge model must be litellm-mapped because atif-trajectory triggers
# get_model_info to size the trajectory token budget; deepseek-v4-* are NOT
# mapped yet, so use the newest mapped deepseek (v3.2).
[judge]
judge = "openrouter/deepseek/deepseek-v3.2"
atif-trajectory = "/logs/agent/trajectory.json"
mode = "individual"

[[criterion]]
name = "task_complete"
description = """KNOWN FACTS: the answer spans three Notion pages. Engineering Onboarding points to the Access Requests Guide, which says production access requires completing the security training and opening a DEVOPS ticket, approved by the Infrastructure lead; the Team Directory names Priya as Infrastructure lead.\n\nGrade PASS only if the agent actually executed Notion tool calls / commands to read the docs AND reported both steps (security training + DEVOPS ticket) AND named Priya as the approver. Grade FAIL if it missed a step, named the wrong person or only the role without the name, or hallucinated."""
type = "binary"
