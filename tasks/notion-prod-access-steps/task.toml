version = "1.0"

[task]
name = "connector-evals/notion-prod-access-steps"
description = "Assemble production-access steps and approver from three seeded onboarding pages. LLM trajectory judge."

[metadata]
difficulty = "medium"
category = "single_step"
tags = ["read-only", "multi-step", "multi-hop"]

[connector_evals]
apps = ["notion"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 300.0

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
# Rewardkit always sends `reasoning_effort` to the judge; DeepSeek models on
# OpenRouter expose `reasoning` (not `reasoning_effort`), so litellm raises
# UnsupportedParamsError. Drop unsupported params instead of erroring.
LITELLM_DROP_PARAMS = "True"
