version = "1.0"

[task]
name = "connector-evals/linear-fleet-runbook"
description = "Read the 'Fleet Runbook' project document: rotation cadence + halt env var. LLM trajectory judge."

[metadata]
difficulty = "easy"
category = "single_step"
tags = ["read-only", "single-step"]

[connector_evals]
apps = ["linear"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 300.0

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
# Rewardkit always sends `reasoning_effort` to the judge; DeepSeek models on
# OpenRouter expose `reasoning` (not `reasoning_effort`), so litellm raises
# UnsupportedParamsError. Drop unsupported params instead of erroring.
LITELLM_DROP_PARAMS = "True"
