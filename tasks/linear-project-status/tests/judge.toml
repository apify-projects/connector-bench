# Single binary verdict from a trajectory judge, same shape as the notion
# tasks. KNOWN FACTS come from src/connector_evals/linear_fixtures.py FIXTURES;
# keep in sync when editing fixture content.
#
# Judge model must be litellm-mapped because atif-trajectory triggers
# get_model_info to size the trajectory token budget; deepseek-v4-* are NOT
# mapped yet, so use the newest mapped deepseek (v3.2).
[judge]
judge = "openrouter/deepseek/deepseek-v3.2"
atif-trajectory = "/logs/agent/trajectory.json"
mode = "individual"

[[criterion]]
name = "task_complete"
description = """KNOWN FACTS: the Linear project 'Crawler v2 Launch' has exactly 3 issues in the Done state ('Update scraper base image for v2', 'Write v2 rollback plan', 'Benchmark v2 vs v1 throughput'). Its milestones are 'Vendor selected' (target 2026-09-30), 'Staged rollout' (2026-10-31), 'Full migration' (2026-11-30); the earliest target date belongs to 'Vendor selected'.\n\nGrade PASS only if the agent actually executed Linear tool calls / commands to obtain the data AND reported 3 Done issues AND named 'Vendor selected' as the milestone with the earliest target date. Grade FAIL if it hallucinated data without querying Linear, miscounted, or named a different milestone."""
type = "binary"
