version = "1.0"

[task]
name = "connector-evals/cross-weekly-ops-brief"
description = "Weekly ops brief across all four apps: Linear bug triage, Notion August failures, a GitHub PR, Apify pricing. LLM trajectory judge."

[metadata]
difficulty = "hard"
category = "cross-app"
tags = ["read-only", "apify", "github", "linear", "notion"]

[connector_evals]
apps = ["apify", "github", "linear", "notion"]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 600.0

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
# Rewardkit always sends `reasoning_effort` to the judge; DeepSeek models on
# OpenRouter expose `reasoning` (not `reasoning_effort`), so litellm raises
# UnsupportedParamsError. Drop unsupported params instead of erroring.
LITELLM_DROP_PARAMS = "True"
