version = "1.0"

[task]
name = "connector-evals/notion-blocklist-needle"
description = "Find a needle and the exact total in a 154-entry seeded blocklist page (forces block pagination). LLM trajectory judge."

[metadata]
difficulty = "medium"
category = "single_step"
tags = ["read-only", "pagination"]

[connector_evals]
apps = ["notion"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 300.0

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
# Rewardkit always sends `reasoning_effort` to the judge; DeepSeek models on
# OpenRouter expose `reasoning` (not `reasoning_effort`), so litellm raises
# UnsupportedParamsError. Drop unsupported params instead of erroring.
LITELLM_DROP_PARAMS = "True"
