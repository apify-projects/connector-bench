# Single binary verdict from a trajectory judge, same shape as the github
# tasks. KNOWN FACTS come from src/connector_evals/notion_fixtures.py FIXTURES;
# keep in sync when editing fixture content.
#
# Judge model must be litellm-mapped because atif-trajectory triggers
# get_model_info to size the trajectory token budget; deepseek-v4-* are NOT
# mapped yet, so use the newest mapped deepseek (v3.2).
[judge]
judge = "openrouter/deepseek/deepseek-v3.2"
atif-trajectory = "/logs/agent/trajectory.json"
mode = "individual"

[[criterion]]
name = "task_complete"
description = """KNOWN FACTS: the Notion page "Domain Blocklist" lists exactly 154 domains as bullet items; acme-metrics.io IS on the list (position 130, past the first 100 blocks, so a correct count requires paginating block children).\n\nGrade PASS only if the agent actually executed Notion tool calls / commands to read the page AND confirmed acme-metrics.io is blocked AND reported exactly 154 total domains. Grade FAIL if the count is wrong (e.g. 100 or 101 from reading only the first page of blocks), the needle answer is wrong, or it hallucinated."""
type = "binary"
